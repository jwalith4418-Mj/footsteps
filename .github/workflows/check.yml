name: Check rules and replay
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install coverage==7.15.4
      - name: Run tests with branch coverage
        run: python -m coverage run -m unittest discover -s tests -v
      - name: Report shipped Python coverage
        run: python -m coverage report
      - run: python -m experiments.run --seeds 2 --out /tmp/smoke.csv
      - run: python -m experiments.summary /tmp/smoke.csv
